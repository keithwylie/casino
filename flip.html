<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip - Station A</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial Black', Arial, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        
        h1 {
            color: #11998e;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 30px;
            font-family: Arial, sans-serif;
        }
        
        .card-table {
            background: linear-gradient(145deg, #2d5016, #3d6b1f);
            border-radius: 20px;
            padding: 40px 30px;
            margin: 30px 0;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.2);
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .card-display {
            width: 180px;
            height: 250px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 5em;
            margin-bottom: 30px;
            transition: transform 0.3s;
        }
        
        .card-display.flip {
            animation: flipCard 0.5s ease-in-out;
        }
        
        @keyframes flipCard {
            0% { transform: rotateY(0deg); }
            50% { transform: rotateY(90deg); }
            100% { transform: rotateY(0deg); }
        }
        
        .card-value {
            font-size: 1em;
            line-height: 1;
        }
        
        .card-suit {
            font-size: 0.8em;
        }
        
        .red-card {
            color: #e74c3c;
        }
        
        .black-card {
            color: #2c3e50;
        }
        
        .status-message {
            color: white;
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 20px;
            min-height: 40px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .prize-message {
            animation: pulse 0.5s ease-in-out;
            color: #ffd700;
            font-size: 2em;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .flip-button {
            background: linear-gradient(145deg, #f39c12, #f1c40f);
            color: white;
            border: none;
            border-radius: 15px;
            padding: 25px 50px;
            font-size: 1.8em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            transition: all 0.2s;
            text-transform: uppercase;
            font-family: 'Arial Black', Arial, sans-serif;
        }
        
        .flip-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        
        .flip-button:active {
            transform: translateY(0);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }
        
        .stat-box {
            text-align: center;
        }
        
        .stat-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
            font-family: Arial, sans-serif;
        }
        
        .stat-value {
            color: #11998e;
            font-size: 2.5em;
            font-weight: bold;
        }
        
        .start-button {
            background: linear-gradient(145deg, #11998e, #38ef7d);
            color: white;
            border: none;
            border-radius: 15px;
            padding: 20px 40px;
            font-size: 1.5em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            margin: 20px;
            transition: all 0.2s;
        }
        
        .start-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        
        .instructions {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: left;
            font-family: Arial, sans-serif;
        }
        
        .instructions h3 {
            color: #11998e;
            margin-bottom: 10px;
        }
        
        .instructions li {
            margin: 8px 0;
            color: #555;
        }
        
        .reset-button {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 25px;
            font-size: 1em;
            cursor: pointer;
            margin-top: 15px;
            font-family: Arial, sans-serif;
        }
        
        .reset-button:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🃏 Card Flip 🃏</h1>
        <p class="subtitle">Station A - Flip for Prizes!</p>
        
        <div class="instructions" id="instructions">
            <h3>How to Play:</h3>
            <ul>
                <li>Press START to begin</li>
                <li>Click "FLIP CARD" to reveal a card</li>
                <li>Watch for red cards (hearts ♥ or diamonds ♦)</li>
                <li>Red cards = prizes!</li>
            </ul>
        </div>
        
        <button class="start-button" id="startBtn" onclick="startGame()">START GAME</button>
        
        <div class="card-table" id="table" style="display: none;">
            <div class="card-display" id="cardDisplay">
                <div class="card-value" id="cardValue">?</div>
                <div class="card-suit" id="cardSuit"></div>
            </div>
            
            <button class="flip-button" id="flipBtn" onclick="flipCard()">
                FLIP CARD
            </button>
            
            <div class="status-message" id="statusMsg"></div>
        </div>
        
        <div class="stats" id="stats" style="display: none;">
            <div class="stat-box">
                <div class="stat-label">Cards Flipped</div>
                <div class="stat-value" id="flips">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Prizes Won</div>
                <div class="stat-value" id="prizes">0</div>
            </div>
        </div>
        
        <button class="reset-button" id="resetBtn" onclick="resetGame()" style="display: none;">Reset Game</button>
    </div>
    
    <script>
        let gameActive = false;
        let flipCount = 0;
        let prizeCount = 0;
        
        // Card definitions
        const redCards = [
            { value: 'A', suit: '♥', color: 'red', name: 'Ace of Hearts' },
            { value: '2', suit: '♥', color: 'red', name: '2 of Hearts' },
            { value: '3', suit: '♥', color: 'red', name: '3 of Hearts' },
            { value: '4', suit: '♥', color: 'red', name: '4 of Hearts' },
            { value: '5', suit: '♥', color: 'red', name: '5 of Hearts' },
            { value: '6', suit: '♥', color: 'red', name: '6 of Hearts' },
            { value: '7', suit: '♥', color: 'red', name: '7 of Hearts' },
            { value: '8', suit: '♥', color: 'red', name: '8 of Hearts' },
            { value: '9', suit: '♥', color: 'red', name: '9 of Hearts' },
            { value: '10', suit: '♥', color: 'red', name: '10 of Hearts' },
            { value: 'J', suit: '♥', color: 'red', name: 'Jack of Hearts' },
            { value: 'Q', suit: '♥', color: 'red', name: 'Queen of Hearts' },
            { value: 'K', suit: '♥', color: 'red', name: 'King of Hearts' },
            { value: 'A', suit: '♦', color: 'red', name: 'Ace of Diamonds' },
            { value: '2', suit: '♦', color: 'red', name: '2 of Diamonds' },
            { value: '3', suit: '♦', color: 'red', name: '3 of Diamonds' },
            { value: '4', suit: '♦', color: 'red', name: '4 of Diamonds' },
            { value: '5', suit: '♦', color: 'red', name: '5 of Diamonds' },
            { value: '6', suit: '♦', color: 'red', name: '6 of Diamonds' },
            { value: '7', suit: '♦', color: 'red', name: '7 of Diamonds' },
            { value: '8', suit: '♦', color: 'red', name: '8 of Diamonds' },
            { value: '9', suit: '♦', color: 'red', name: '9 of Diamonds' },
            { value: '10', suit: '♦', color: 'red', name: '10 of Diamonds' },
            { value: 'J', suit: '♦', color: 'red', name: 'Jack of Diamonds' },
            { value: 'Q', suit: '♦', color: 'red', name: 'Queen of Diamonds' },
            { value: 'K', suit: '♦', color: 'red', name: 'King of Diamonds' }
        ];
        
        const blackCards = [
            { value: 'A', suit: '♠', color: 'black', name: 'Ace of Spades' },
            { value: '2', suit: '♠', color: 'black', name: '2 of Spades' },
            { value: '3', suit: '♠', color: 'black', name: '3 of Spades' },
            { value: '4', suit: '♠', color: 'black', name: '4 of Spades' },
            { value: '5', suit: '♠', color: 'black', name: '5 of Spades' },
            { value: '6', suit: '♠', color: 'black', name: '6 of Spades' },
            { value: '7', suit: '♠', color: 'black', name: '7 of Spades' },
            { value: '8', suit: '♠', color: 'black', name: '8 of Spades' },
            { value: '9', suit: '♠', color: 'black', name: '9 of Spades' },
            { value: '10', suit: '♠', color: 'black', name: '10 of Spades' },
            { value: 'J', suit: '♠', color: 'black', name: 'Jack of Spades' },
            { value: 'Q', suit: '♠', color: 'black', name: 'Queen of Spades' },
            { value: 'K', suit: '♠', color: 'black', name: 'King of Spades' },
            { value: 'A', suit: '♣', color: 'black', name: 'Ace of Clubs' },
            { value: '2', suit: '♣', color: 'black', name: '2 of Clubs' },
            { value: '3', suit: '♣', color: 'black', name: '3 of Clubs' },
            { value: '4', suit: '♣', color: 'black', name: '4 of Clubs' },
            { value: '5', suit: '♣', color: 'black', name: '5 of Clubs' },
            { value: '6', suit: '♣', color: 'black', name: '6 of Clubs' },
            { value: '7', suit: '♣', color: 'black', name: '7 of Clubs' },
            { value: '8', suit: '♣', color: 'black', name: '8 of Clubs' },
            { value: '9', suit: '♣', color: 'black', name: '9 of Clubs' },
            { value: '10', suit: '♣', color: 'black', name: '10 of Clubs' },
            { value: 'J', suit: '♣', color: 'black', name: 'Jack of Clubs' },
            { value: 'Q', suit: '♣', color: 'black', name: 'Queen of Clubs' },
            { value: 'K', suit: '♣', color: 'black', name: 'King of Clubs' }
        ];
        
        function getRandomCard(mustBeRed) {
            const deck = mustBeRed ? redCards : blackCards;
            return deck[Math.floor(Math.random() * deck.length)];
        }
        
        function startGame() {
            gameActive = true;
            flipCount = 0;
            prizeCount = 0;
            
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('instructions').style.display = 'none';
            document.getElementById('table').style.display = 'flex';
            document.getElementById('stats').style.display = 'flex';
            document.getElementById('resetBtn').style.display = 'inline-block';
            
            resetCardDisplay();
        }
        
        function flipCard() {
            if (!gameActive) return;
            
            // Disable button during flip and delay
            const flipBtn = document.getElementById('flipBtn');
            flipBtn.disabled = true;
            
            flipCount++;
            document.getElementById('flips').textContent = flipCount;
            
            // FR5: Every 5th flip gets a red card (prize)
            const isFifthFlip = (flipCount % 5 === 0);
            const card = getRandomCard(isFifthFlip);
            
            // Animate flip
            const cardDisplay = document.getElementById('cardDisplay');
            cardDisplay.classList.add('flip');
            
            setTimeout(() => {
                // Show card
                document.getElementById('cardValue').textContent = card.value;
                document.getElementById('cardSuit').textContent = card.suit;
                
                // Set color
                if (card.color === 'red') {
                    cardDisplay.className = 'card-display flip red-card';
                } else {
                    cardDisplay.className = 'card-display flip black-card';
                }
                
                // Check for prize (every 5th flip)
                if (isFifthFlip) {
                    prizeCount++;
                    document.getElementById('prizes').textContent = prizeCount;
                    showPrize();
                } else {
                    showNoPrize();
                }
                
                // Re-enable button after 2 second delay
                setTimeout(() => {
                    flipBtn.disabled = false;
                }, 2000);
            }, 250);
            
            setTimeout(() => {
                cardDisplay.classList.remove('flip');
            }, 500);
        }
        
        function showPrize() {
            const statusMsg = document.getElementById('statusMsg');
            statusMsg.textContent = '🎉 RED CARD! Prize! 🎉';
            statusMsg.className = 'status-message prize-message';
            
            setTimeout(() => {
                statusMsg.textContent = '';
                statusMsg.className = 'status-message';
            }, 2000);
        }
        
        function showNoPrize() {
            const statusMsg = document.getElementById('statusMsg');
            statusMsg.textContent = 'Keep flipping!';
            
            setTimeout(() => {
                statusMsg.textContent = '';
            }, 1500);
        }
        
        function resetCardDisplay() {
            document.getElementById('cardValue').textContent = '?';
            document.getElementById('cardSuit').textContent = '';
            document.getElementById('cardDisplay').className = 'card-display';
            document.getElementById('statusMsg').textContent = '';
        }
        
        function resetGame() {
            gameActive = false;
            flipCount = 0;
            prizeCount = 0;
            
            document.getElementById('flips').textContent = '0';
            document.getElementById('prizes').textContent = '0';
            
            resetCardDisplay();
            
            document.getElementById('startBtn').style.display = 'inline-block';
            document.getElementById('instructions').style.display = 'block';
            document.getElementById('table').style.display = 'none';
            document.getElementById('stats').style.display = 'none';
            document.getElementById('resetBtn').style.display = 'none';
        }
    </script>
</body>
</html>
